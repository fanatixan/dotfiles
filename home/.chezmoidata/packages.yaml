# One list, one line per package:
#   - name                           CLI tool; brew, apt, apk and cargo use the same name
#   - { name: fd, apt: fd-find }     CLI tool with another name per package manager
#   - { name: gh, roles: [...] }     limit to roles (default: workstation, worker, container)
#   - { name: x, tap: owner/tap }    Homebrew formula from a tap; the tap gets trusted
#   - { cask: ghostty }              macOS GUI app, workstation only
#   - { mas: 497799835, name: X }    Mac App Store app, workstation only
# Rule: build and dev tools go everywhere, everything else is workstation only.
# The agent role installs nothing; it uses the worker's Homebrew.
packages:
  # --- CLI: build and dev, everywhere
  - agda                                            # proof assistant
  - { name: asdf, brew: asdf }                      # runtime version manager
  - bat                                             # better cat
  - curl
  - { name: delta, brew: git-delta, cargo: git-delta }  # diff tool
  - direnv                                          # env vars per folder
  - eza                                             # better ls
  - { name: fd, brew: fd, apt: fd-find, apk: fd }   # simpler find
  - fzf                                             # fuzzy finder
  - git
  - { name: git-lfs, brew: git-lfs }
  - glow                                            # markdown renderer
  - jq                                              # json processor
  - just                                            # task runner
  - neovim
  - pandoc                                          # document converter
  - ripgrep                                         # better grep
  - sd                                              # simpler sed
  - { name: tldr, brew: tlrc, cargo: tlrc }         # simpler man pages
  - tmux
  - tmuxinator
  - { name: top-alternative, brew: bottom, apt: btop, apk: btop }
  - { name: unzip, roles: [worker, container] }   # asdf-gradle needs it; macOS ships it
  - watchexec                                       # run commands on file changes
  - wget
  - yq                                              # yaml, json and csv processor
  - { name: zoxide, brew: zoxide, apk: zoxide, cargo: zoxide }  # better cd

  # --- CLI: workstation only
  - { name: act, roles: [workstation] }             # run GitHub Actions locally
  - { name: cloudflared, roles: [workstation] }
  - { name: consul, tap: hashicorp/tap, roles: [workstation] }
  - { name: container, roles: [workstation] }       # Apple container CLI
  - { name: cookiecutter, roles: [workstation] }
  - { name: dust, roles: [workstation] }            # disk usage
  - { name: flux, tap: fluxcd/tap, roles: [workstation] }
  - { name: gh, roles: [workstation] }              # GitHub CLI
  - { name: gpg, roles: [workstation] }
  - { name: httpie, roles: [workstation] }          # HTTP client
  - { name: mas, roles: [workstation] }             # App Store CLI
  - { name: mosh, roles: [workstation] }            # resilient ssh
  - { name: netlify-cli, roles: [workstation] }
  - { name: nomad, tap: hashicorp/tap, roles: [workstation] }
  - { name: scrcpy, roles: [workstation] }          # mirror an Android screen
  - { name: thefuck, roles: [workstation] }         # correct the previous command
  - { name: viddy, roles: [workstation] }           # better watch

