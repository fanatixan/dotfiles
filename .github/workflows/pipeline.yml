name: Run Tests on Various Platforms

permissions:
  checks: write
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - home/**
      - .chezmoiroot
      - init*.sh
      - tests/**
      - scripts/**
      - .github/workflows/pipeline.yml
  pull_request:
    paths:
      - home/**
      - .chezmoiroot
      - init*.sh
      - tests/**
      - scripts/**
      - .github/workflows/pipeline.yml
  workflow_dispatch: {}

# Every job applies the checked-out commit (DOTFILES_SOURCE), not GitHub main.
jobs:
  verify-roles:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install chezmoi bash
      - run: tests/roles.sh
      - run: tests/bump.sh
      - run: tests/shells.sh
  # glibc collation (en_US.UTF-8) sorts _zsh after python; macOS doesn't
  verify-linux-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y zsh locales
          sudo locale-gen en_US.UTF-8
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - run: PATH="$HOME/.local/bin:$PATH" SHELLS_LOCALE=en_US.UTF-8 tests/shells.sh
  verify-alpine-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a plain Alpine container: setup-alpine broke on the runner's sudo, and
      # its steps ran on the Ubuntu host anyway
      - run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh -euc '
            apk add --no-cache curl git sudo
            adduser -D dev
            echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
            su dev -c "cd ~ && target_env=container DOTFILES_SOURCE=/src sh /src/init.sh"
            su dev -c "test -f ~/.dotfiles/git/aliases"
          '
  verify-ubuntu-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: target_env=container DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -f $HOME/.dotfiles/git/aliases
      # - run: eza
  verify-ubuntu-worker-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu Server lacks tools the runner has; the install must bring its own
      - run: sudo dpkg -r --force-depends unzip jq
      - run: target_env=worker DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -x /home/linuxbrew/.linuxbrew/bin/unzip
      # zsh-autocomplete must run compinit itself: an earlier compinit leaves its
      # functions undefined from the second shell on (the first clones plugins)
      - run: |
          export TERM=xterm-256color
          zsh -c 'autoload -Uz compaudit; compaudit' || true  # folders compinit calls insecure
          zsh -i -c '.autocomplete__compinit:precmd' >/dev/null 2>&1 || true
          zsh -i -c '.autocomplete__compinit:precmd; (( $+functions[_autocomplete__unambiguous] ))'
      - run: test -f $HOME/.dotfiles/git/aliases
      - run: test ! -e $HOME/.dotfiles/1password
      - run: /home/linuxbrew/.linuxbrew/bin/jq --version
      # runtimes land in the shared /opt/asdf the agent user reads
      - run: |
          export ASDF_DATA_DIR=/opt/asdf PATH="/opt/asdf/shims:/opt/uv/bin:/home/linuxbrew/.linuxbrew/bin:$PATH"
          cd /tmp
          java -version
          node --version
          python --version
          test -x /home/linuxbrew/.linuxbrew/bin/tlc
  verify-mac-installation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: target_env=container DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -f $HOME/.dotfiles/git/aliases
      # - run: eza
