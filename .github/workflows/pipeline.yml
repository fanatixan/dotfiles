name: Run Tests on Various Platforms

permissions:
  checks: write
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - home/**
      - .chezmoiroot
      - init*.sh
      - tests/**
      - .github/workflows/pipeline.yml
  pull_request:
    paths:
      - home/**
      - .chezmoiroot
      - init*.sh
      - tests/**
      - .github/workflows/pipeline.yml
  workflow_dispatch: {}

# Every job applies the checked-out commit (DOTFILES_SOURCE), not GitHub main.
jobs:
  verify-roles:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install chezmoi
      - run: tests/roles.sh
  verify-alpine-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a plain Alpine container: setup-alpine broke on the runner's sudo, and
      # its steps ran on the Ubuntu host anyway
      - run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh -euc '
            apk add --no-cache curl git sudo
            adduser -D dev
            echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
            su dev -c "cd ~ && target_env=container DOTFILES_SOURCE=/src sh /src/init.sh"
            su dev -c "test -f ~/.dotfiles/git/aliases"
          '
  verify-ubuntu-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: target_env=container DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -f $HOME/.dotfiles/git/aliases
      # - run: eza
  verify-ubuntu-worker-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: target_env=worker DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -f $HOME/.dotfiles/git/aliases
      - run: test ! -e $HOME/.dotfiles/1password
      - run: /home/linuxbrew/.linuxbrew/bin/jq --version
      # runtimes land in the shared /opt/asdf the agent user reads
      - run: |
          export ASDF_DATA_DIR=/opt/asdf PATH="/opt/asdf/shims:/opt/uv/bin:/home/linuxbrew/.linuxbrew/bin:$PATH"
          cd /tmp
          java -version
          node --version
          python --version
          test -x /home/linuxbrew/.linuxbrew/bin/tlc
  verify-mac-installation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: target_env=container DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh init.sh
      - run: test -f $HOME/.dotfiles/git/aliases
      # - run: eza
